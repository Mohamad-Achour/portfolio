<section id="competences" class="section">
  <div class="container">

    <div class="section-head">
      <p class="eyebrow">02 / Compétences</p>
      <h2 class="h2">Ma boîte à outils</h2>
    </div>

    <div class="grid">
      @for (group of groups; track group.title) {
        <div class="card">
          <div class="card__head">
            <span class="card__icon">{{ group.code }}</span>
            <h3 class="card__title">{{ group.title }}</h3>
          </div>

          <div class="chips">
            @for (item of group.items; track item) {
              <span class="chip--grey">{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>

  </div>
</section>
